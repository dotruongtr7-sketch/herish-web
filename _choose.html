<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chọn ảnh cô gái cho Herish</title>
<style>
  body{font-family:system-ui,Segoe UI,sans-serif;background:#f4f2fb;margin:0;padding:24px;color:#37306b}
  h1{font-size:1.4rem}
  p{color:#736d96}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:18px}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(102,91,175,.12)}
  .card img{width:100%;height:320px;object-fit:cover;display:block;background:#eee}
  .card .n{font-weight:800;font-size:1.1rem;color:#665baf;padding:10px 14px 2px}
  .card .d{font-size:.84rem;color:#736d96;padding:0 14px 14px}
</style></head>
<body>
  <h1>🎁 Chọn ảnh cô gái cầm quà — Anh chỉ cần nói SỐ</h1>
  <p>Anh xem rồi nhắn em ví dụ: <b>"dùng ảnh số 2"</b>. Em sẽ tách nền (chỉ còn người) và gắn vào hero trang chủ.</p>
  <div class="grid" id="g"></div>
  <script>
    const items=[
      {id:"6699463",d:"Châu Á, váy hoa, mở hộp quà, bất ngờ (miệng mở)"},
      {id:"5740575",d:"Tóc nâu, cười bất ngờ rạng rỡ, hộp quà to, nền trắng"},
      {id:"5705085",d:"Da trắng, cầm hộp quà HỒNG bên má, cười duyên"},
      {id:"6650003",d:"Châu Á, tóc ngắn, cười tươi, hộp quà nơ nâu"},
      {id:"5740553",d:"Tóc nâu, cười lớn, ôm chồng hộp quà, nền trắng"},
      {id:"8669722",d:"Châu Á, đang mở quà"},
      {id:"6699462",d:"Châu Á, váy hoa, cầm hộp quà đỏ"},
      {id:"6699470",d:"Châu Á, mở hộp quà trắng, vui (đang dùng ở trang login)"}
    ];
    document.getElementById('g').innerHTML=items.map((it,i)=>`
      <div class="card">
        <img src="https://images.pexels.com/photos/${it.id}/pexels-photo-${it.id}.jpeg?auto=compress&cs=tinysrgb&w=500" alt="">
        <div class="n">Ảnh số ${i+1}</div>
        <div class="d">${it.d}</div>
      </div>`).join('');
  </script>
</body>
</html>
