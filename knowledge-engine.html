function pagehead(pre,name,description,actions=''){return `<div class="head"><div><div class="eyebrow">${pre}</div><h1>${name}</h1><p>${description}</p></div><div class="headActions">${actions}</div></div>`}
function shell(body){return `<div class="app"><aside class="side"><div class="brand"><div class="logo">✦</div><div><strong>XTRUONGMKTER</strong><small>SECOND BRAIN · LLM WIKI</small></div></div><div class="caption">HỆ ĐIỀU HÀNH TRI THỨC</div><nav>${NAV.map(([key,ico,title])=>`<button class="nav ${page===key?'active':''}" data-act="nav" data-page="${key}"><span class="ico">${ico}</span><span>${title}</span></button>`).join('')}</nav><div class="side-foot"><b>● PILOT 2.0 · CHẠY TRÊN MÁY</b><p>Ngân Hà chung, dữ liệu theo HERISH · CERISH · ORISH. Bộ lọc demo không thay thế quyền truy cập máy chủ.</p><p>Biên soạn hiện là <b>quy tắc cục bộ</b>, chưa kết nối mô hình A.I.</p></div></aside><header class="top"><button class="searchTrigger" data-act="nav" data-page="ask">⌕ &nbsp; Hỏi dữ liệu đã xuất bản trong Wiki <span>↗</span></button><div class="righttop">${label('DỮ LIỆU MẪU','warn')}<select class="scope" id="globalScope" aria-label="Phạm vi dự án">${Object.entries(PR).filter(([k])=>!LOCKED||k===LOCK||k==='shared').map(([k,v])=>`<option value="${k}" ${scope===k?'selected':''}>${v}</option>`).join('')}</select>${btn('↓ Sao lưu','backup','small ghost')}</div></header><main class="page">${body}<div class="footer">XTRUONGMKTER Knowledge Engine Pilot 2.0 · Chưa kết nối LLM, Drive, CRM, ERP · Dữ liệu chỉ ở trình duyệt hiện tại · Bộ quy tắc vận hành nằm trong tệp BO_QUY_TAC_VAN_HANH.md</div></main></div>`}
function metric(title,num,color){return `<div class="metric" style="--tone:${color}"><small>${title}</small><strong>${num}</strong><i class="accent" style="display:block"></i></div>`}
function overview(){const rawCount=state.raw.filter(scoped).length, draftsCount=state.drafts.filter(x=>scoped(x)&&['ready_for_review','conflict','needs_extraction','duplicate'].includes(x.status)).length;return pagehead('SECOND BRAIN / LIVING KNOWLEDGE','Bộ não thứ hai biết tích lũy tri thức','Từ dữ liệu gốc đến Wiki được duyệt, mọi tri thức đều có nguồn và có thể truy ngược lịch sử.',btn('＋ Nhập nguồn mới','nav','primary','data-page="inbox"')+btn('◇ Hỏi Second Brain','nav','','data-page="ask"'))+`<div class="cards">${metric('Nguồn gốc đã tiếp nhận',rawCount,'#76caff')}${metric('Nháp đang chờ xử lý',draftsCount,'#b18cfa')}${metric('Trang Wiki đã xuất bản',scopedPublished().length,'#5fe6c3')}${metric('Sự kiện nhật ký',state.logs.length,'#ffa9cc')}</div><div class="grid2"><div class="card"><div class="cardhead"><h2>Ngân Hà tri thức</h2>${label('LIÊN KẾT CHUNG','purple')}</div><div class="diagram"><div class="orbit"></div><div class="orbit two"></div><div class="centerOrb">✦<b>XTRUONGMKTER</b><small>WIKI CORE</small></div>${['herish','cerish','orish'].map((p,i)=>`<button class="planet ${['a','b','c'][i]}" data-act="pick" data-project="${p}" title="Xem tri thức ${PR[p]}" style="--tone:${CL[p]}">${PR[p].slice(0,2)}</button>`).join('')}</div><div class="hint" style="margin-top:10px">Nhấp sao để lọc. Trong bản chính thức, các nút Ngân Hà sẽ lấy từ trang Wiki và quan hệ đã được phê duyệt.</div></div><div class="card"><div class="cardhead"><h2>Quy trình hoạt động</h2>${btn('Mở xử lý','nav','small','data-page="process"')}</div><div class="pipeline">${['Nguồn gốc','Biên soạn','Kiểm duyệt','Wiki','Hỏi & Lint'].map((s,i)=>`<div class="step"><b>0${i+1}</b><small>${s}</small></div>`).join('')}</div><div class="cardhead"><h3>Quy tắc bất biến</h3></div><div class="vgrid">${[['R01','Raw không sửa'],['R02','Phải có nguồn'],['R04','Khóa framework'],['R05','Tách dự án']].map(([n,s])=>`<div class="tile"><strong>${n} · ${s}</strong></div>`).join('')}</div><div class="divider"></div><div class="hint">Mọi thay đổi SOP, giá, pháp lý, framework cần người duyệt. Dữ liệu số hiện tại phải đọc CRM/ERP, không suy từ Wiki.</div></div></div><div class="grid2" style="margin-top:14px"><div class="card"><div class="cardhead"><h2>Trang Wiki mới cập nhật</h2>${btn('Xem kho →','nav','small ghost','data-page="wiki"')}</div>${scopedPublished().slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,4).map(x=>wikiRow(x)).join('')||'<div class="empty">Chưa có trang Wiki được xuất bản.</div>'}</div><div class="card"><div class="cardhead"><h2>Nhật ký kiểm soát</h2>${label('AUDIT TRAIL')}</div>${state.logs.slice(0,5).map(l=>`<div class="listrow"><span class="dot" style="--tone:#9c8afe"></span><div class="grow"><strong>${esc(l.message)}</strong><small>${day(l.at)} · ${esc(l.op)} · ${esc(l.objectId)}</small></div></div>`).join('')}</div></div>`}
function rawRow(x){const match=state.drafts.find(v=>v.sourceIds?.includes(x.id));return `<div class="listrow"><span class="dot" style="--tone:${CL[x.project]}"></span><div class="grow"><strong>${esc(x.title)}</strong><small>${day(x.capturedAt)} · ${esc(x.type)} · RAW #${esc(x.id.slice(-8))} · Vân tay ${esc(x.hash)}</small><div class="inlinechips">${ptag(x.project)}${match?tagStatus(match.status):label('Chưa biên soạn','purple')}${x.demo?label('MẪU','warn'):''}</div></div><div class="actions">${btn('Xem gốc','raw-detail','small','data-id="'+esc(x.id)+'"')}${!match?btn('Biên soạn','compile','small primary','data-id="'+esc(x.id)+'"'):''}</div></div>`}
function inbox(){return pagehead('01 / CAPTURE · RAW','Hộp tiếp nhận tri thức','Lưu nguồn gốc bất biến. Đọc tệp văn bản, ghi nguồn, dự án và trạng thái biên soạn.',btn('＋ Nhập ghi chú','modal-add','primary'))+`<div class="grid2"><div class="card"><div class="cardhead"><h2>Nguồn đã tiếp nhận</h2>${label('RAW / READ ONLY')}</div><div class="actions" style="margin-bottom:12px"><input id="rawSearch" class="field" placeholder="Tìm tiêu đề, văn bản gốc" value="${esc(query)}"></div><div class="scroll">${state.raw.filter(x=>scoped(x)&&normalize(x.title+' '+x.content).includes(normalize(query))).slice().sort((a,b)=>b.capturedAt.localeCompare(a.capturedAt)).map(rawRow).join('')||'<div class="empty">Chưa có nguồn trong phạm vi này.</div>'}</div></div><div class="stack"><div class="card"><div class="cardhead"><h2>Nhập tệp văn bản</h2></div><p class="hint">Hỗ trợ .txt, .md, .json, .csv (tối đa 500 KB). PDF/Word/ghi âm cần dịch vụ trích xuất riêng; demo chưa đọc được các định dạng đó.</p><input type="file" class="field" id="uploadInput" accept=".txt,.md,.csv,.json,text/plain,text/markdown,application/json" multiple><div class="hint" style="margin-top:10px">Mỗi tệp được lưu thành một nguồn mới và chưa tự xuất bản.</div></div><div class="card"><h3>Nguyên tắc nạp dữ liệu</h3><div class="hint">• Không sửa dữ liệu gốc sau khi tiếp nhận.<br>• Mỗi bản ghi có nguồn, dự án và mã nhận diện.<br>• Không tự coi một URL chưa đọc là kiến thức.<br>• Chỉ đăng xuất Wiki sau bước kiểm duyệt.</div></div></div></div>`}
function draftRow(x){const raw=x.sourceIds.map(r).filter(Boolean);return `<div class="listrow"><span class="dot" style="--tone:${x.status==='conflict'?'#ff99ac':'#a795ff'}"></span><div class="grow"><strong>${esc(x.proposedTitle)}</strong><small>${esc(PR[x.project])} · ${day(x.createdAt)} · ${raw.map(v=>v.title).join(' / ')}</small><div class="inlinechips">${tagStatus(x.status)}${x.riskFlags.map(v=>label(v,'warn')).join('')}</div></div>${btn('Xem & duyệt','draft-detail','small primary','data-id="'+esc(x.id)+'"')}</div>`}
function process(){const pending=state.raw.filter(x=>scoped(x)&&!state.drafts.some(v=>v.sourceIds?.includes(x.id)));return pagehead('02 / COMPILE · REVIEW','Trung tâm xử lý & biên soạn Wiki','Kiểm trùng, tạo bản nháp có dẫn nguồn, phát hiện rủi ro và duyệt xuất bản. Các tóm lược ở bản demo được tạo theo quy tắc, chưa qua mô hình A.I.',btn('⚙ Biên soạn nguồn mới','compile-all','primary'))+`<div class="pipeline">${['Raw bất biến','Phát hiện trùng','Bản nháp Wiki','Người duyệt','Publish + nhật ký'].map((s,i)=>`<div class="step"><b>0${i+1}</b><small>${s}</small></div>`).join('')}</div><div class="grid2"><div class="card"><div class="cardhead"><h2>Hàng chờ kiểm duyệt</h2>${label(state.drafts.filter(x=>x.status==='ready_for_review'||x.status==='conflict').length+' mục','warn')}</div><div class="scroll">${state.drafts.filter(scoped).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(draftRow).join('')||'<div class="empty">Chưa có bản nháp. Hãy nhập nguồn và nhấn Biên soạn.</div>'}</div></div><div class="stack"><div class="card"><div class="cardhead"><h2>Nguồn chưa xử lý</h2>${label(pending.length+' nguồn')}</div>${pending.map(x=>`<div class="listrow"><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(PR[x.project])}</small></div>${btn('Biên soạn','compile','small','data-id="'+esc(x.id)+'"')}</div>`).join('')||'<div class="hint">Mọi nguồn trong phạm vi đã có bản nháp.</div>'}</div><div class="card"><h3>Kiểm soát thay đổi</h3><p class="hint">Một nguồn có thể cập nhật trang Wiki hiện có. Bản cũ được lưu trong lịch sử. Từ khóa nhạy cảm như framework 8 yếu tố, tam giác A.I và chính sách giá luôn có cờ yêu cầu kiểm tra.</p></div></div></div>`}
function sourcePage(){return pagehead('03 / INTEGRATIONS','Nguồn dữ liệu & đồng bộ','Theo dõi trạng thái nguồn. Chưa kết nối thật: các nút chỉ mô tả yêu cầu để triển khai hệ thống máy chủ.',btn('↓ Xuất bản sao lưu','backup','primary'))+`<div class="grid3">${state.connectors.map(x=>`<div class="card"><div class="cardhead"><h3>${esc(x.name)}</h3>${label(x.status,'warn')}</div><p class="hint">Nguồn: ${esc(x.kind)}. Chưa có OAuth/API, chưa đọc và chưa đồng bộ bất kỳ bản ghi bên ngoài nào.</p>${btn('Điều kiện kết nối','connector-info','small','data-name="'+esc(x.name)+'"')}</div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Quy tắc đồng bộ</h2>${label('CHỈ THIẾT KẾ','warn')}</div><div class="grid3"><div class="tile"><strong>CRM → Data Hub</strong><p>Khách hàng, lead, hoạt động, phiên bản và thời gian cập nhật.</p></div><div class="tile"><strong>ERP → Data Hub</strong><p>Đơn hàng, tồn kho, giao dịch, ngân sách; không nhân đôi nguồn ghi dữ liệu.</p></div><div class="tile"><strong>Hub → Second Brain</strong><p>Chỉ dữ liệu đã cấp quyền. Dẫn nguồn về mã bản ghi chuẩn, không bịa số.</p></div></div></div>`}
function wikiRow(x){return `<div class="listrow"><span class="dot" style="--tone:${CL[x.project]}"></span><div class="grow"><strong>${esc(x.title)}</strong><small>v${x.version} · ${day(x.updatedAt)} · ${x.sourceIds.length} nguồn · ${esc(x.reviewedBy)}</small><div class="inlinechips">${ptag(x.project)}${x.demo?label('MẪU','warn'):label('ĐÃ DUYỆT','success')}${x.protected?label('BẢO VỆ','bad'):''}</div></div>${btn('Mở Wiki','wiki-detail','small','data-id="'+esc(x.id)+'"')}</div>`}
function lintResults(){const res=[];const published=scopedPublished();for(const x of published){if(!x.sourceIds.length||x.sourceIds.some(sid=>!r(sid)))res.push({severity:'error',text:'Trang '+x.title+' không có nguồn gốc hợp lệ.'});if(!x.title.trim()||!x.body.trim())res.push({severity:'error',text:'Trang '+x.title+' thiếu tiêu đề hoặc nội dung.'});if(published.length>1&&x.relatedIds.length===0)res.push({severity:'warning',text:'Trang '+x.title+' chưa có liên kết Wiki xác nhận.'});if(!x.demo&&(Date.now()-new Date(x.updatedAt).getTime())>90*86400000)res.push({severity:'warning',text:'Trang '+x.title+' hơn 90 ngày chưa rà soát (mốc demo).'});const same=state.wiki.filter(v=>v.project===x.project&&v.slug===x.slug&&v.id!==x.id&&v.status==='published');if(same.length)res.push({severity:'error',text:'Trùng tên/slugs trong '+PR[x.project]+': '+x.title});}return res}
function knowledge(){const lint=lintResults();const pages=scopedPublished().filter(x=>normalize(x.title+' '+x.body+' '+x.tags.join(' ')).includes(normalize(query)));return pagehead('04 / COMPOUNDING KNOWLEDGE','Kho tri thức sống','Chỉ xem các trang Wiki đã được duyệt. Giữ bản gốc, nguồn tham khảo, phiên bản và những mối liên hệ có thật.',btn('✓ Kiểm tra chất lượng Wiki','lint','primary'))+`<div class="grid2"><div class="card"><div class="cardhead"><h2>Danh mục Wiki</h2>${label(pages.length+' trang','success')}</div><div style="margin-bottom:12px"><input class="field" id="wikiSearch" placeholder="Tìm trang Wiki đã xuất bản..." value="${esc(query)}"></div>${pages.map(wikiRow).join('')||'<div class="empty">Không tìm thấy trang Wiki trong phạm vi được chọn.</div>'}</div><div class="stack"><div class="card"><div class="cardhead"><h2>Kiểm tra sức khỏe tri thức</h2>${lint.length?label(lint.length+' cảnh báo','warn'):label('Không thấy lỗi cấu trúc','success')}</div><p class="hint">Kiểm tra nguồn, trang cô lập, lịch rà soát và bản trùng. Không đánh giá được mâu thuẫn ngữ nghĩa nếu chưa kết nối A.I thật.</p>${lint.slice(0,3).map(a=>`<div class="listrow"><span class="dot" style="--tone:${a.severity==='error'?'#ff92ae':'#ffd08c'}"></span><div class="grow"><strong>${esc(a.text)}</strong></div></div>`).join('')||'<p class="good mini">Tạm thời chưa có lỗi cấu trúc trong phạm vi này.</p>'}</div><div class="card"><div class="cardhead"><h2>Liên kết giữa các trang</h2></div><p class="hint">Các trang dùng chung chủ đề có thể được đề xuất liên kết, nhưng liên kết chỉ thành chính thức sau khi duyệt. Demo không tự vẽ các quan hệ chưa được xác nhận.</p></div></div></div>`}
function hitsFor(queryText){const tokens=tokenSet(queryText);return scopedPublished().map(x=>{const target=normalize(x.title+' '+x.title+' '+x.summary+' '+x.body+' '+x.tags.join(' '));let score=0;for(const t of tokens)if(target.includes(t))score++;return{page:x,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6)}
function answerMarkup(){if(!lastAnswer)return '';const {question,hits,asOf}=lastAnswer;if(!hits.length)return `<div class="answer"><h3>Chưa đủ căn cứ để trả lời</h3><p>Không tìm thấy trang Wiki đã duyệt phù hợp với câu hỏi <b>${esc(question)}</b> trong phạm vi <b>${esc(PR[scope])}</b>.</p><div class="notice">Không tự suy đoán số liệu, chính sách hoặc thông tin khách hàng. Hãy nạp và duyệt tài liệu phù hợp hoặc truy vấn CRM/ERP khi đã kết nối.</div></div>`;return `<div class="answer"><h3>Kết quả truy xuất tri thức đã duyệt</h3><p>Em tìm được <b>${hits.length}</b> trang Wiki có từ khóa liên quan. Đây là <b>trích xuất theo quy tắc</b> (chưa phải câu trả lời do A.I tổng hợp), không đồng nghĩa mọi nội dung được kiểm chứng độc lập.</p><p class="statusline">Phạm vi: ${esc(PR[scope])} · Tra cứu: ${day(asOf)}</p>${hits.map(({page:p,score},i)=>`<div class="source"><b>[${i+1}] ${esc(p.title)} · v${p.version} ${p.demo?'[MẪU]':''}</b><small>${esc(PR[p.project])} · Cập nhật ${day(p.updatedAt)} · Điểm từ khóa ${score} · ${p.sourceIds.length} nguồn</small><blockquote>${esc(p.summary.slice(0,420))}</blockquote><div class="actions">${btn('Xem trang Wiki','wiki-detail','small','data-id="'+esc(p.id)+'"')}${p.sourceIds[0]?btn('Xem nguồn gốc','raw-detail','small ghost','data-id="'+esc(p.sourceIds[0])+'"'):''}</div></div>`).join('')}<div class="notice" style="margin-top:12px">Với con số hiện tại về doanh thu, đơn hàng, tồn kho, cần dữ liệu chuẩn từ CRM/ERP. Phiên bản này chưa có kết nối dữ liệu thật.</div><div class="actions" style="margin-top:12px">${btn('＋ Lưu kết quả làm bản nháp Wiki','promote','primary')}</div></div>`}
function asking(){return pagehead('05 / QUERY · TRACE','Hỏi đáp & kiểm chứng','Tìm kiếm toàn bộ Wiki đã duyệt theo phạm vi dự án và truy ngược nguồn gốc. Không coi bản nháp hay nội dung chưa duyệt là sự thật.',btn('Mở kho Wiki','nav','small','data-page="wiki"'))+`<div class="grid2"><div class="card"><div class="cardhead"><h2>Đặt câu hỏi với Second Brain</h2>${label('CÓ NGUỒN · CHƯA CÓ LLM','warn')}</div><form id="askForm"><label class="formlabel" for="askText">Câu hỏi / chủ đề cần tìm</label><textarea id="askText" class="field" required placeholder="Ví dụ: HERISH cần làm gì khi khách yêu cầu đổi trả?">${esc(lastAnswer?.question||'')}</textarea><div class="actions" style="margin-top:10px"><button class="btn primary" type="submit">⌕ Truy xuất nguồn đã duyệt</button><span class="hint">Chỉ tra phạm vi: ${esc(PR[scope])}</span></div></form>${answerMarkup()}</div><div class="stack"><div class="card"><h3>Ví dụ truy vấn</h3><div class="stack" style="margin-top:12px">${['HERISH đổi trả','CERISH hình sản phẩm','ORISH tư vấn khách spa','Quyết định về chính sách giá'].map(s=>btn(esc(s),'question','ghost','data-q="'+esc(s)+'"')).join('')}</div></div><div class="card"><h3>Quy tắc trả lời</h3><p class="hint">1. Chỉ tra Wiki đã xuất bản.<br>2. Hiển thị trang, phiên bản và nguồn gốc.<br>3. Nguồn mâu thuẫn / thiếu → không tự kết luận.<br>4. Câu trả lời được lưu lại chỉ là bản nháp cần duyệt.</p></div></div></div>`}
function modal(inner,title){return `<div class="modalBackdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${esc(title)}</h2>${btn('✕','close','small ghost')}</div>${inner}</div></div>`}
function modalAdd(){return modal(`<form id="captureForm"><div class="fields"><div><label class="formlabel">Tên nguồn *</label><input class="field" name="title" required maxlength="140" placeholder="Ví dụ: SOP CSKH HERISH"></div><div><label class="formlabel">Thuộc dự án *</label><select class="field" name="project" required>${Object.entries(PR).filter(([k])=>!LOCKED||k===LOCK||k==='shared').filter(([k])=>k!=='all').map(([k,v])=>`<option value="${k}" ${k===scope?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="formlabel">Loại nguồn</label><select class="field" name="type"><option>Ghi chú</option><option>Biên bản họp</option><option>Văn bản nghiên cứu</option><option>SOP dự thảo</option><option>Nội dung website đã sao chép có quyền</option></select></div><div><label class="formlabel">Nguồn / người cung cấp</label><input class="field" name="origin" placeholder="Người nhập hoặc tài liệu tham chiếu"></div></div><label class="formlabel" style="margin-top:14px">Văn bản gốc *</label><textarea class="field" name="content" required placeholder="Dán nguyên văn ở đây. Không thêm chỉ dẫn bí mật, dữ liệu khách hàng nhạy cảm trong bản demo."></textarea><label class="formlabel" style="margin-top:14px">URL nguồn (nếu có)</label><input class="field" name="url" placeholder="https://... (lưu địa chỉ, không tự tải nội dung)"><p class="hint">Nguồn được thêm mới và giữ nguyên; chưa tham gia trả lời cho đến khi được biên soạn và phê duyệt.</p><div class="actions" style="justify-content:flex-end">${btn('Huỷ','close','ghost')}<button type="submit" class="btn primary">Lưu nguồn gốc</button></div></form>`,'Tiếp nhận nguồn tri thức')}
function rawModal(x){return modal(`<div class="inlinechips">${ptag(x.project)}${label(x.type)}${x.demo?label('DỮ LIỆU MẪU','warn'):''}</div><p class="statusline">ID: <span class="copy">${esc(x.id)}</span></p><p class="statusline">Ghi nhận: ${day(x.capturedAt)} · Vân tay kiểm trùng: <span class="copy">${esc(x.hash)}</span></p><p class="statusline">Xuất xứ: ${esc(x.origin||'Không rõ')}${x.url?' · URL: '+esc(x.url):''}</p><div class="wikiContent">${esc(x.content||'(Không có văn bản trích xuất)')}</div><div class="notice" style="margin-top:12px">Nguồn gốc chỉ đọc. Nếu cần thay đổi, hãy thêm một nguồn/phiên bản mới và liên kết với bản cũ; bản demo chưa có workflow thay thế nguồn tự động.</div><div class="actions" style="margin-top:12px">${!state.drafts.some(y=>y.sourceIds.includes(x.id))?btn('Biên soạn nguồn','compile','primary','data-id="'+esc(x.id)+'"'):''}${btn('Đóng','close','ghost')}</div>`,'Nguồn gốc · '+x.title)}
function draftModal(x){const refs=x.sourceIds.map(r).filter(Boolean);const p=x.targetWikiId?w(x.targetWikiId):null;return modal(`<div class="inlinechips">${ptag(x.project)}${tagStatus(x.status)}${x.riskFlags.map(z=>label(z,'warn')).join('')}</div><p class="statusline">Nguồn: ${refs.map(z=>'['+z.id+'] '+z.title).join(' · ')}</p><h3>Dự kiến: ${p?'Cập nhật Wiki '+p.title+' → v'+(p.version+1):'Tạo trang Wiki mới'}</h3><div class="divider"></div><strong>Tóm lược đề xuất</strong><div class="wikiContent" style="max-height:220px">${esc(x.summary)}</div>${p?`<p class="hint">Phiên bản hiện tại: v${p.version}; khi duyệt, hệ thống lưu lịch sử bản cũ và bổ sung nguồn mới. Không sửa nội dung nguồn cũ.</p>`:''}<div class="card" style="margin-top:12px"><h3>Điểm cần kiểm duyệt</h3><p class="hint">Bản demo chỉ rút trích văn bản theo quy tắc, không có mô hình A.I xác nhận ý nghĩa. Người duyệt phải đọc nguồn và xác minh nội dung thực tế. Các flag chỉ là tín hiệu sàng lọc.</p>${x.riskFlags.map(flag=>`<div class="notice" style="margin-bottom:7px">${esc(flag)}</div>`).join('')||'<span class="good mini">Chưa nhận diện từ khóa cảnh báo.</span>'}</div>${x.status==='ready_for_review'||x.status==='conflict'?`<div class="fields" style="margin-top:13px"><div><label class="formlabel">Người duyệt (demo)</label><input id="reviewer" class="field" placeholder="Nhập người chịu trách nhiệm" value="Người quản trị"></div><div><label class="formlabel">Ghi chú duyệt</label><input id="reviewNote" class="field" placeholder="Đã đối chiếu nguồn ..."></div></div><div class="actions" style="margin-top:14px">${btn('✓ Duyệt xuất bản Wiki','publish','teal','data-id="'+esc(x.id)+'"')}${btn('Từ chối','reject','ghost','data-id="'+esc(x.id)+'"')}</div>`:'<p class="hint">Trạng thái này chưa đủ điều kiện xuất bản; cần xử lý nội dung hoặc trùng lặp trước.</p>'}`,'Biên soạn Wiki · '+x.proposedTitle)}
function wikiModal(x){const sourceList=x.sourceIds.map(r).filter(Boolean);return modal(`<div class="inlinechips">${ptag(x.project)}${label('WIKI v'+x.version,'success')}${x.protected?label('KHÓA KIỂM DUYỆT','bad'):''}${x.demo?label('VÍ DỤ MẪU','warn'):''}</div><h2 class="wikiTitle">${esc(x.title)}</h2><div class="statusline">Cập nhật ${day(x.updatedAt)} · Người duyệt: ${esc(x.reviewedBy)}</div><div class="divider"></div><div class="wikiContent">${esc(x.body)}</div><div class="card" style="margin-top:12px"><h3>Truy ngược nguồn gốc (${sourceList.length})</h3>${sourceList.map(s=>`<div class="listrow"><div class="grow"><strong>${esc(s.title)}</strong><small>${esc(s.origin)} · ${day(s.capturedAt)}</small></div>${btn('Mở raw','raw-detail','small','data-id="'+esc(s.id)+'"')}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Lịch sử phiên bản</h3><p class="hint">Phiên bản hiện tại v${x.version}. ${x.history?.length||0} bản cũ được giữ lại.</p>${(x.history||[]).map(v=>`<div class="listrow"><div class="grow"><strong>Phiên bản ${v.version}</strong><small>${day(v.changedAt)} · ${esc(v.reviewedBy||'Không rõ')}</small></div></div>`).join('')}</div>`,'Trang Wiki đã xuất bản')}
function lintModal(){const issues=lintResults();return modal(`<div class="inlinechips">${issues.length?label(issues.length+' điểm cần kiểm tra','warn'):label('Không có lỗi cấu trúc','success')}</div><p class="hint">Lint kiểm tra cấu trúc, không tự sửa trang Wiki. Chưa có mô hình A.I nên chưa xác nhận được mâu thuẫn ngữ nghĩa thực.</p>${issues.map((x,i)=>`<div class="listrow"><span class="dot" style="--tone:${x.severity==='error'?'#ff9bad':'#ffd08c'}"></span><div class="grow"><strong>${i+1}. ${esc(x.text)}</strong><small>${x.severity==='error'?'Lỗi cấu trúc':'Cần kiểm tra'}</small></div></div>`).join('')||'<div class="empty">Không phát hiện lỗi cấu trúc trong Wiki đã duyệt ở phạm vi này.</div>'}<div class="actions">${btn('Đóng','close','primary')}</div>`,'Báo cáo chất lượng Wiki')}
function connectorModal(name){return modal(`<div class="notice">Chưa có kết nối hoạt động. Không nhập khóa API hoặc token vào HTML demo này.</div><p class="hint">Khi triển khai chính thức cần: ủy quyền OAuth/API phù hợp, danh sách dự án/đối tượng được phép truy xuất, trường định danh dùng chung, adapter chuẩn hóa, webhook/polling, retry, đối soát và kiểm tra phân quyền trên máy chủ.</p>`,'Thiết lập nguồn · '+name)}
let dialog=null;function showDialog(type,arg){if(type==='add')dialog=modalAdd();else if(type==='raw')dialog=rawModal(arg);else if(type==='draft')dialog=draftModal(arg);else if(type==='wiki')dialog=wikiModal(arg);else if(type==='lint')dialog=lintModal();else if(type==='connector')dialog=connectorModal(arg);renderDialog()}
function renderDialog(){document.getElementById('dlg')?.remove();if(dialog)document.body.insertAdjacentHTML('beforeend',`<div id="dlg">${dialog}</div>`)}
function closeDialog(){dialog=null;renderDialog()}
function render(){const html=page==='overview'?overview():page==='inbox'?inbox():page==='process'?process():page==='sources'?sourcePage():page==='wiki'?knowledge():asking();document.getElementById('app').innerHTML=shell(html);renderDialog()}
function addRaw(payload){if(!payload.title?.trim()||!payload.content?.trim())return toast('Cần tiêu đề và nội dung nguồn.');if(!PR[payload.project]||payload.project==='all')return toast('Chọn dự án cụ thể hoặc tri thức chung.');const it={id:id('raw'),project:payload.project,title:payload.title.trim().slice(0,140),content:payload.content,type:payload.type||'Ghi chú',origin:payload.origin||'Nhập trực tiếp',url:payload.url||'',capturedAt:date(),hash:fp(payload.content),access:'internal',demo:false};state.raw.unshift(it);log('ingest',it.id,'Đã tiếp nhận nguồn mới: '+it.title);store();closeDialog();navTo('inbox');toast('Đã lưu nguồn bất biến. Biên soạn khi đã sẵn sàng.')}
function compileRaw(sourceId){const x=r(sourceId);if(!x)return;const old=state.drafts.find(v=>v.sourceIds?.includes(x.id));if(old){showDialog('draft',old);return}const rawText=x.content.trim();const risk=[],same=state.raw.find(z=>z.id!==x.id&&z.project===x.project&&z.hash===x.hash&&z.content===x.content);const match=state.wiki.find(v=>v.project===x.project&&v.slug===slug(x.title)&&v.status==='published');const n=normalize(x.title+' '+x.content);let status='ready_for_review';if(!rawText){status='needs_extraction';risk.push('Chưa trích xuất được văn bản nguồn')}if(same){status='duplicate';risk.push('Nội dung trùng nguồn '+same.id)}if(match&&match.sourceIds.every(sid=>sid!==x.id)){risk.push('Có trang Wiki cùng tiêu đề: xem bản cập nhật và tránh ghi đè')}if(protectedWords.some(z=>n.includes(z))){risk.push('Tài liệu chứa chủ đề bảo vệ: framework/giá/pháp lý; phải duyệt thủ công')}
const tags=termDefs.filter(([term])=>n.includes(term)).map(([,tag])=>tag).slice(0,8);const summary=rawText.length>480?rawText.slice(0,480).trim()+'…':rawText;const draft={id:id('draft'),sourceIds:[x.id],project:x.project,proposedTitle:x.title,summary,proposedTags:tags,createdAt:date(),targetWikiId:match?.id||null,riskFlags:risk,status,compiler:'pilot_rules_v2',relatedIds:[],provenance:'raw'};state.drafts.unshift(draft);log('compile',draft.id,'Tạo bản nháp Wiki từ '+x.title);store();render();toast('Đã biên soạn bản nháp. Hãy kiểm duyệt và xuất bản.')}
function compileAll(){const list=state.raw.filter(x=>scoped(x)&&!state.drafts.some(v=>v.sourceIds.includes(x.id)));list.forEach(x=>compileRawSilent(x));store();render();toast('Đã biên soạn '+list.length+' nguồn mới.')}
function compileRawSilent(x){if(state.drafts.some(v=>v.sourceIds.includes(x.id)))return;const n=normalize(x.title+' '+x.content),tags=termDefs.filter(([needle])=>n.includes(needle)).map(([,tag])=>tag).slice(0,8);const same=state.raw.find(z=>z.id!==x.id&&z.project===x.project&&z.hash===x.hash&&z.content===x.content);const old=state.wiki.find(z=>z.project===x.project&&z.slug===slug(x.title)&&z.status==='published');const risks=[];if(same)risks.push('Nguồn trùng '+same.id);if(old)risks.push('Cập nhật trang đang tồn tại');if(protectedWords.some(z=>n.includes(z)))risks.push('Chủ đề được bảo vệ');const draft={id:id('draft'),sourceIds:[x.id],project:x.project,proposedTitle:x.title,summary:x.content.slice(0,480),proposedTags:tags,createdAt:date(),targetWikiId:old?.id||null,riskFlags:risks,status:x.content.trim()?same?'duplicate':'ready_for_review':'needs_extraction',compiler:'pilot_rules_v2',relatedIds:[],provenance:'raw'};state.drafts.unshift(draft);log('compile',draft.id,'Biên soạn: '+x.title)}
function publish(idv){const draft=d(idv);if(!draft||!['ready_for_review','conflict'].includes(draft.status))return toast('Bản nháp chưa ở trạng thái có thể duyệt.');const reviewer=document.getElementById('reviewer')?.value.trim()||'';const reviewNote=document.getElementById('reviewNote')?.value.trim()||'';if(reviewer.length<2||reviewNote.length<5)return toast('Cần người duyệt và ghi chú xác nhận đối chiếu nguồn (tối thiểu 5 ký tự).');if(draft.riskFlags.some(x=>/bảo vệ|framework|giá|pháp lý/i.test(x))&&!confirm('Tài liệu thuộc nhóm bảo vệ. Xác nhận anh đã đối chiếu và có thẩm quyền duyệt?'))return;const originals=draft.sourceIds.map(r).filter(Boolean);if(!originals.length)return toast('Không tìm thấy nguồn gốc để xuất bản.');const now=date(),target=draft.targetWikiId?w(draft.targetWikiId):null;const block=draft.summary;const protect=draft.riskFlags.some(x=>/bảo vệ|framework|giá|pháp lý/i.test(x));let pageWiki;
if(target){const history=[...(target.history||[]),{version:target.version,body:target.body,summary:target.summary,reviewedBy:target.reviewedBy,changedAt:target.updatedAt,sourceIds:[...target.sourceIds]}];const newBody=target.body+'\n\n---\nNguồn bổ sung '+day(now)+': '+block;pageWiki={...target,version:target.version+1,body:newBody,summary:target.summary,sourceIds:[...new Set([...target.sourceIds,...draft.sourceIds])],tags:[...new Set([...target.tags,...draft.proposedTags])],history,reviewedBy:reviewer,reviewedAt:now,updatedAt:now,protected:target.protected||protect};state.wiki=state.wiki.map(z=>z.id===target.id?pageWiki:z)}else{pageWiki={id:id('wiki'),project:draft.project,slug:slug(draft.proposedTitle),title:draft.proposedTitle,summary:block.slice(0,260),body:block,sourceIds:[...draft.sourceIds],relatedIds:[],tags:draft.proposedTags,status:'published',version:1,history:[],reviewedBy:reviewer,reviewedAt:now,updatedAt:now,protected:protect,demo:false};state.wiki.unshift(pageWiki)}
draft.status='approved';draft.reviewedAt=now;draft.reviewedBy=reviewer;draft.reviewNote=reviewNote;draft.publishedWikiId=pageWiki.id;
log('publish',pageWiki.id,'Duyệt Wiki '+pageWiki.title+' v'+pageWiki.version+' bởi '+reviewer);store();closeDialog();navTo('wiki');toast('Đã xuất bản Wiki v'+pageWiki.version+'. Nguồn gốc và lịch sử được giữ lại.')}
function reject(draftId){const dr=d(draftId);if(!dr)return;dr.status='rejected';log('reject',dr.id,'Từ chối bản nháp: '+dr.proposedTitle);store();closeDialog();render();toast('Đã từ chối bản nháp; nguồn gốc vẫn còn.')}
function ask(question){const text=question.trim();if(!text)return toast('Nhập câu hỏi.');lastAnswer={question:text,hits:hitsFor(text),asOf:date()};log('query','query',`Tra cứu Wiki trong ${PR[scope]} (${lastAnswer.hits.length} kết quả)`);store();render()}
function promote(){if(!lastAnswer?.hits?.length)return toast('Không có nguồn để tạo bản nháp.');const projectsFound=[...new Set(lastAnswer.hits.map(hit=>hit.page.project))];if(projectsFound.length>1)return toast('Kết quả gồm nhiều dự án. Hãy chọn đúng một dự án trước khi lưu bản nháp, tránh trộn dữ liệu.');const sourceIds=[...new Set(lastAnswer.hits.flatMap(hit=>hit.page.sourceIds))];const draft={id:id('draft'),project:projectsFound[0],sourceIds,proposedTitle:'Tổng hợp nghiên cứu: '+lastAnswer.question.slice(0,90),summary:'Câu hỏi: '+lastAnswer.question+'\n\nCác trang tham chiếu: '+lastAnswer.hits.map(z=>z.page.title).join('; ')+'.\n\nChỉ là tài liệu phái sinh, cần kiểm chứng từ nguồn gốc.',proposedTags:['Tổng hợp nghiên cứu'],createdAt:date(),targetWikiId:null,riskFlags:['Tài liệu phái sinh: không được dùng làm chứng cứ độc lập; kiểm tra quyền chia sẻ nguồn'],status:'ready_for_review',compiler:'query-promote-demo',relatedIds:lastAnswer.hits.map(z=>z.page.id),provenance:'derived'};state.drafts.unshift(draft);log('promote',draft.id,'Lưu kết quả tìm kiếm thành bản nháp cần duyệt');store();navTo('process');toast('Đã tạo bản nháp nghiên cứu. Không tự xuất bản.')}
function backup(){const content=JSON.stringify(state,null,2);const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download='XTRUONGMKTER_SECOND_BRAIN_V2_BACKUP.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function uploadFiles(files){if(!files?.length)return;let success=0;for(const f of files){if(f.size>500000){toast('Bỏ qua tệp quá 500 KB: '+f.name);continue}const ext=f.name.split('.').pop().toLowerCase();if(!['txt','md','csv','json'].includes(ext)){toast('Chưa đọc nội dung tệp '+f.name+'. Chỉ hỗ trợ TXT/MD/CSV/JSON.');continue}const content=await f.text();const project=scope==='all'?'shared':scope;addRawSilent({title:f.name,content,project,origin:'Tệp máy tính: '+f.name,type:'Tệp '+ext.toUpperCase(),url:''});success++}store();navTo('inbox');toast('Đã tiếp nhận '+success+' tệp văn bản. Kiểm tra dự án trước khi biên soạn.')}
function addRawSilent(v){const obj={id:id('raw'),project:v.project,title:v.title,content:v.content,origin:v.origin,type:v.type,url:v.url||'',capturedAt:date(),hash:fp(v.content),access:'internal',demo:false};state.raw.unshift(obj);log('ingest',obj.id,'Nạp tệp: '+v.title)}
const app=document.getElementById('app');document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el){if(e.target.id==='backdrop')closeDialog();return}e.preventDefault();const ac=el.dataset.act,v=el.dataset.id;switch(ac){case 'nav':navTo(el.dataset.page);break;case 'pick':if(!LOCKED)scope=el.dataset.project;navTo('wiki');break;case 'modal-add':showDialog('add');break;case 'close':closeDialog();break;case 'raw-detail':showDialog('raw',r(v));break;case 'draft-detail':showDialog('draft',d(v));break;case 'wiki-detail':showDialog('wiki',w(v));break;case 'compile':closeDialog();compileRaw(v);break;case 'compile-all':compileAll();break;case 'publish':publish(v);break;case 'reject':reject(v);break;case 'lint':{log('lint','wiki','Quét chất lượng Wiki: '+lintResults().length+' vấn đề');store();showDialog('lint');break}case 'connector-info':showDialog('connector',el.dataset.name);break;case 'backup':backup();break;case 'question':ask(el.dataset.q);break;case 'promote':promote();break}});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='askForm')ask(document.getElementById('askText').value)});
document.addEventListener('submit',e=>{if(e.target.id==='captureForm'){e.preventDefault();addRaw(Object.fromEntries(new FormData(e.target).entries()))}});
app.addEventListener('change',e=>{if(e.target.id==='globalScope'){scope=(LOCKED&&e.target.value!==LOCK&&e.target.value!=='shared')?LOCK:e.target.value;selected=null;render()}if(e.target.id==='uploadInput')uploadFiles(e.target.files)});
app.addEventListener('input',e=>{if(e.target.id==='rawSearch'||e.target.id==='wikiSearch'){const inputId=e.target.id,pos=e.target.selectionStart;query=e.target.value;render();const node=document.getElementById(inputId);node?.focus();node?.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog)closeDialog();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navTo('ask');document.getElementById('askText')?.focus()}});
render();
})();
</script></body></html>
