const fmt=d=>d?new Date(d).toLocaleDateString('vi-VN'):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const scoped=x=>scope==='all'||x.project===scope;const counts=()=>({total:db.items.length,new:db.items.filter(x=>x.status==='new').length,review:db.items.filter(x=>x.status==='review').length,approved:db.items.filter(x=>x.status==='approved').length});
const st={new:['Chưa xử lý','purple'],review:['Chờ xác nhận','gold'],approved:['Đã duyệt','green'],duplicate:['Nghi trùng lặp','red'],needs:['Thiếu nội dung','red'],rejected:['Đã loại','red']};
function badgeStatus(s){let a=st[s]||[s,''];return `<span class="chip ${a[1]}">${a[0]}</span>`}
function projectBadge(p){return `<span class="chip" style="border-color:${colors[p]||'#456'};color:${colors[p]||'#bdc8db'}">● ${esc(projects[p]||p)}</span>`}
const btn=(label,act,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-act="${act}" ${attrs}>${label}</button>`;
function toast(msg){const prev=document.querySelector('.toast');if(prev)prev.remove();const div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.append(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3500)}
function go(s){page=s;tab='all';q='';answer=null;modal=null;render();window.scrollTo({top:0,behavior:'instant'})}
function heading(eyebrow,title,sub,actions=''){return `<div class="pagehead"><div><span class="eyebrow">${eyebrow}</span><h1>${title}</h1><p>${sub}</p></div><div class="pageactions">${actions}</div></div>`}
function shell(content){let navHtml=nav.map(([key,symbol,label])=>`<button type="button" class="nav ${page===key?'active':''}" data-act="goto" data-page="${key}" aria-current="${page===key?'page':'false'}"><span aria-hidden="true" style="font-size:20px;min-width:19px;text-align:center">${symbol}</span><b>${label}</b></button>`).join('');return `<div class="shell"><aside class="side"><div class="brand"><div class="brand-mark">✦</div><div><strong>XTRUONGMKTER</strong><small>SECOND BRAIN · KNOWLEDGE ENGINE</small></div></div><div class="nav-caption">TRUNG TÂM TRI THỨC</div>${navHtml}<div class="side-foot"><span class="system-status"><i class="status-dot"></i>ĐANG CHẠY BẢN THỬ NGHIỆM</span><strong style="margin-top:11px">Một bộ não · 3 dự án</strong><p>HERISH · CERISH · ORISH được phân loại riêng. Không ghi dữ liệu thật lên máy chủ.</p></div></aside><header class="top"><button class="top-search" data-act="global-search">⌕ &nbsp; Tìm trong tri thức, tài liệu, ghi chú... <kbd>Ctrl K</kbd></button><div class="top-right"><span class="pill">● Lưu trên trình duyệt</span><select id="scopeSelect" aria-label="Phạm vi tri thức">${Object.entries(projects).map(([k,v])=>`<option value="${k}" ${k===scope?'selected':''}>${v}</option>`).join('')}</select>${btn('⇩ Sao lưu','export','small ghost')}</div></header><main class="workspace"><div class="content">${content}</div></main></div>${modal?renderModal():''}`}
function home(){const c=counts();return heading('SECOND BRAIN / KNOWLEDGE ENGINE','Hệ điều hành tri thức của anh','Luồng thông tin: Tiếp nhận → Xử lý → Kết nối → Lưu trữ → Truy xuất. CRM/ERP là nguồn nghiệp vụ riêng.',btn('＋ Nhập tri thức','note','primary')+btn('✧ Hỏi dữ liệu','goto','', 'data-page="ask"'))+`<div class="grid four" style="margin-bottom:14px">${metric('◈','Tổng tài liệu',c.total,'#72c9ff')}${metric('▣','Chưa xử lý',c.new,'#ad8cff')}${metric('◷','Chờ xác nhận',c.review,'#ffc078')}${metric('✓','Đã vào kho',c.approved,'#45dfc4')}</div><div class="maincols"><div class="card"><div class="cardhead"><h2>Ngân Hà tri thức</h2><span class="chip purple">Bản đồ kết nối chung</span></div><div class="galaxy-map"><div class="orbit-ring"></div><div class="orbit-ring two"></div><div class="core">✧<div>XTRUONGMKTER<span>TRI THỨC TRUNG TÂM</span></div></div><button class="starbtn a" data-act="scope-project" data-project="herish" style="--tone:${colors.herish}">HERISH</button><button class="starbtn b" data-act="scope-project" data-project="cerish" style="--tone:${colors.cerish}">CERISH</button><button class="starbtn c" data-act="scope-project" data-project="orish" style="--tone:${colors.orish}">ORISH</button><span class="galaxy-caption">Chọn ngôi sao để lọc tri thức của dự án.<br>Ngân Hà là lớp khám phá, không phải nơi nhập giao dịch.</span></div><div class="galaxy-hint">✦ Các ngôi sao đại diện cho dữ liệu đã tiếp nhận; chỉ tài liệu được duyệt mới tham gia trả lời câu hỏi.</div></div><div class="card"><div class="cardhead"><h2>Luồng vận hành</h2>${btn('Xem xử lý →','goto','small','data-page="process"')}</div>${[['01','Thu nhận dữ liệu','inbox'],['02','Trích xuất, phân loại','process'],['03','Kết nối nguồn','sources'],['04','Lưu kho tri thức','library'],['05','Hỏi đáp có nguồn','ask']].map(([no,label,k])=>`<div class="mini-log"><span class="dot" style="--tone:#8c86ff"></span><div class="grow"><strong>${no} · ${label}</strong><small>${k==='sources'?'Chưa kết nối hệ thống ngoài':'Truy cập phân hệ chức năng'}</small></div>${btn('↗','goto','small ghost',`data-page="${k}"`)}</div>`).join('')}</div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="cardhead"><h3>Tài liệu mới</h3>${btn('Mở hộp tiếp nhận','goto','small','data-page="inbox"')}</div>${db.items.slice().reverse().slice(0,4).map(x=>logRow(x)).join('')}</div><div class="card"><div class="cardhead"><h3>Cần anh xác nhận</h3>${btn('Mở trung tâm xử lý','goto','small','data-page="process"')}</div>${(db.items.filter(x=>x.status==='review'||x.status==='duplicate'||x.status==='needs').slice(0,4).map(x=>logRow(x)).join(''))||'<div class="empty">Chưa có tài liệu chờ duyệt.</div>'}</div></div>`}
function metric(ic,title,value,tone){return `<div class="card metric" style="--tone:${tone}"><div class="symbol">${ic}</div><div><strong class="num">${value}</strong><span class="cap">${title}</span></div></div>`}
function logRow(x){return `<div class="mini-log"><span class="dot" style="--tone:${colors[x.project]||'#66aaff'}"></span><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(projects[x.project])} · ${fmt(x.created)} · ${st[x.status]?.[0]||x.status}</small></div>${btn('↗','detail','small ghost',`data-id="${esc(x.id)}"`)}</div>`}
function inbox(){const items=db.items.filter(scoped).filter(x=>(tab==='all'||x.status===tab)&&(!q||norm(x.title+' '+x.text).includes(norm(q))));return heading('01 / THU THẬP','Hộp tiếp nhận tri thức','Nơi đưa ghi chú, đường dẫn, tệp và thông tin mới vào Second Brain; chưa tự động coi là tri thức đúng.',btn('＋ Ghi chú','note','primary')+btn('⛓ Dán liên kết','link')+btn('⇪ Tải tệp','upload'))+`<div class="inbox-capture"><div class="card"><div class="cardhead"><h2>Thu nhận nhanh</h2><span class="chip">CAPTURE</span></div><p class="muted small">Nhập nội dung mới vào hộp chờ, gắn dự án và xử lý qua bước kiểm chứng trước khi công bố.</p><div class="grid two"><button class="btn" data-act="note" style="padding:20px 8px;white-space:normal">✎ &nbsp;Ghi chú mới</button><button class="btn" data-act="link" style="padding:20px 8px;white-space:normal">⛓ &nbsp;Lưu đường dẫn</button></div></div><div class="card"><div class="cardhead"><h2>Nhận tệp từ thiết bị</h2><span class="chip purple">OFFLINE (không cần mạng)</span></div><label class="drop" for="fileInput"><strong>⇧ Kéo thả / Chọn tệp tại đây</strong><span>TXT, MD, CSV, JSON: đọc nội dung<br>PDF, DOCX, âm thanh: ghi nhận tệp, chờ bộ đọc chuyên dụng</span></label><input type="file" id="fileInput" hidden multiple accept=".txt,.md,.csv,.json,.pdf,.docx,.mp3,.wav,.m4a,.png,.jpg,.jpeg"></div></div><div class="card"><div class="cardhead"><h2>Danh sách thông tin tiếp nhận <span class="muted tiny">(${items.length})</span></h2><div class="toolbar" style="margin:0">${btn('Dữ liệu mẫu / Sao lưu','export','small ghost')}</div></div><div class="toolbar"><select class="select" id="inboxStatus"><option value="all">Tất cả trạng thái</option>${Object.entries(st).map(([k,v])=>`<option value="${k}" ${tab===k?'selected':''}>${v[0]}</option>`).join('')}</select><input class="field" id="itemSearch" placeholder="Lọc tiêu đề, nội dung..." value="${esc(q)}"></div><div class="tablewrap"><table class="datatable"><thead><tr><th>Tên dữ liệu</th><th>Dự án</th><th>Loại</th><th>Ngày nhập</th><th>Trạng thái</th><th>Mở</th></tr></thead><tbody>${items.map(x=>`<tr data-act="detail" data-id="${esc(x.id)}"><td><div class="rowtitle">${esc(x.title)}</div><div class="rowdesc">${esc(x.origin)}</div></td><td>${projectBadge(x.project)}</td><td>${esc(x.kind)}</td><td>${fmt(x.created)}</td><td>${badgeStatus(x.status)}</td><td>↗</td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">Không có tài liệu phù hợp.</div>'}</div></div>`}
function process(){const items=db.items.filter(scoped).filter(x=>tab==='all'||x.status===tab);const pending=items.filter(x=>x.status==='new'||x.status==='review'||x.status==='needs'||x.status==='duplicate');const shown=selected?db.items.find(x=>x.id===selected):pending[0]||items[0];return heading('02 / KNOWLEDGE PIPELINE','Trung tâm xử lý dữ liệu','Kiểm tra đầu vào, nhận dạng trùng, đề xuất phân loại, đưa vào hàng chờ xác nhận và lập kho.',btn('⚙ Xử lý tất cả mục mới','process-all','primary'))+`<div class="pipeline"><div class="step on">1 · Tiếp nhận</div><div class="step on">2 · Chuẩn hóa</div><div class="step on">3 · Phân loại</div><div class="step on">4 · Kiểm chứng</div><div class="step ok">5 · Đưa vào kho</div></div><div class="maincols"><div class="card"><div class="cardhead"><h2>Hàng đợi xử lý <span class="chip gold">${pending.length} mục cần xem</span></h2></div><div class="toolbar"><select id="processStatus" class="select"><option value="all">Mọi trạng thái</option>${Object.entries(st).map(([k,v])=>`<option value="${k}" ${tab===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>${items.map(x=>`<button style="width:100%;background:transparent;border:0;text-align:left;color:inherit;padding:0" data-act="select-process" data-id="${esc(x.id)}">${logSummary(x)}</button>`).join('')||'<div class="empty">Không có mục trong hàng đợi.</div>'}</div><div class="card"><div class="cardhead"><h2>Kiểm tra tài liệu</h2>${shown?badgeStatus(shown.status):''}</div>${shown?`<div class="processing-detail"><span class="muted tiny">${esc(shown.id)}</span><h3>${esc(shown.title)}</h3><div class="toolbar">${projectBadge(shown.project)}<span class="chip">${esc(shown.kind)}</span></div><p>${esc(shown.text.slice(0,460)||'Chưa trích xuất được nội dung để đưa vào kho.')}</p><dl class="info-list"><dt>Nguồn</dt><dd>${esc(shown.origin)}</dd><dt>Phân loại</dt><dd>${esc(projects[shown.project]||'Chưa rõ')}</dd><dt>Từ khóa</dt><dd>${esc((shown.tags||[]).join(', ')||'Chưa phân loại')}</dd><dt>Xác thực</dt><dd>${shown.verified?'Đã xác nhận thủ công':'Chưa xác nhận'}</dd></dl><div class="sep"></div><div class="toolbar">${btn('⚙ Chạy xử lý','process-one','primary small',`data-id="${esc(shown.id)}"`)}${btn('✓ Duyệt vào kho','approve','teal small',`data-id="${esc(shown.id)}"`)}${btn('× Loại bỏ','reject','danger small',`data-id="${esc(shown.id)}"`)}</div><div class="boxnote">Chỉ duyệt khi thông tin đủ nguồn và phù hợp. Trình xử lý ở bản thử nghiệm dùng quy tắc, không thay người xác nhận.</div></div>`:'<div class="empty">Chưa có tài liệu để xử lý.</div>'}</div></div>`}
function logSummary(x){return `<div class="mini-log" style="text-align:left"><span class="dot" style="--tone:${colors[x.project]}"></span><div class="grow"><strong>${esc(x.title)}</strong><small>${esc(projects[x.project])} · ${fmt(x.created)}</small></div>${badgeStatus(x.status)}</div>`}
function sources(){const list=[['◎','Nhập thủ công / Thiết bị','Đang sử dụng','Ghi chú, tệp TXT/MD/CSV/JSON. Đọc nội dung trên thiết bị.','local'],['⛓','Liên kết website','Chỉ lưu URL','Lưu địa chỉ nguồn; không tự lấy nội dung website khi chạy offline.','url'],['▣','Google Drive','Chưa kết nối','Khi triển khai máy chủ, có thể đồng bộ tệp đã cấp quyền.','drive'],['◉','CRM','Chưa kết nối','Dữ liệu khách hàng và lịch sử tương tác qua API đã phân quyền.','crm'],['⚙','ERP','Chưa kết nối','Dữ liệu vận hành, tài chính, đơn hàng qua API đã phân quyền.','erp'],['✉','Email / Lịch','Chưa kết nối','Ghi chú cuộc họp, thư và sự kiện từ nguồn đã cho phép.','mail']];return heading('03 / DATA SOURCES','Nguồn dữ liệu & Đồng bộ','Xác định chính xác dữ liệu đến từ đâu, nguồn nào đang hoạt động, nguồn nào cần quyền truy cập.',btn('⇩ Xuất dữ liệu nội bộ','export')+btn('⇧ Nhập bản sao lưu','import'))+`<div class="boxnote" style="margin-bottom:16px">● Bản thử nghiệm chạy trên trình duyệt: chỉ nguồn nhập thủ công hoạt động. Những kết nối Google Drive, CRM và ERP chưa được xác thực và chưa đồng bộ dữ liệu thực.</div><div class="sourcegrid">${list.map(([ic,title,stat,desc,key])=>`<div class="sourcebox"><div class="icon">${ic}</div><h3>${title}</h3><span class="chip ${key==='local'?'green':key==='url'?'gold':''}">${stat}</span><p>${desc}</p>${btn(key==='local'?'Mở tiếp nhận':key==='url'?'Lưu liên kết':'Xem yêu cầu tích hợp',key==='local'?'goto':key==='url'?'link':'connector','small',`data-page="inbox" data-connector="${key}"`)}</div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Nguyên tắc đồng bộ</h2></div><div class="flowgrid">${[['1','Xác thực'],['2','Chọn phạm vi'],['3','Đồng bộ tăng dần'],['4','Ghi lịch sử'],['5','Kiểm tra & lập chỉ mục']].map(([a,b])=>`<div class="step">${a}. ${b}</div>`).join('')}</div><p class="muted small">Để đồng bộ thật cần có máy chủ, quyền truy cập, API, cơ chế đồng bộ thay đổi và theo dõi lỗi. Không lấy mật khẩu hoặc token của người dùng trong bản demo.</p></div>`}
function library(){const items=db.items.filter(x=>x.status==='approved'&&scoped(x)).filter(x=>!q||norm(x.title+' '+x.text+' '+x.tags.join(' ')).includes(norm(q)));return heading('04 / KNOWLEDGE BASE','Kho tri thức & Liên kết','Chỉ hiển thị tài liệu đã duyệt. Giữ bản gốc, phiên bản, dự án, thẻ chủ đề và nguồn để truy xuất lại.',btn('＋ Nhập thêm tri thức','note','primary'))+`<div class="card" style="margin-bottom:14px"><div class="toolbar" style="margin:0"><input id="librarySearch" class="field" style="flex:1" placeholder="Tìm trong kho tri thức đã duyệt..." value="${esc(q)}"><span class="chip green">${items.length} tài liệu đã duyệt</span></div></div><div class="docgrid">${items.map(x=>`<button class="doccard" data-act="detail" data-id="${esc(x.id)}"><span class="fileicon">▤</span><strong>${esc(x.title)}</strong><p>${esc(x.text.slice(0,130))}${x.text.length>130?'…':''}</p><div class="bottom">${projectBadge(x.project)}<span class="tiny muted">v${x.version||1}</span></div></button>`).join('')}</div>${!items.length?'<div class="card empty">Chưa có dữ liệu đã duyệt. Hãy vào Trung tâm xử lý để xác nhận tài liệu trước.</div>':''}`}
const stopWords=new Set('la co cho cua trong va de anh em khi voi duoc tu thi nay tren mot nhung cac vao phai hay ve da can khong nhu the nao nhieu bao nhieu'.split(' '));
function tokens(s){return [...new Set(norm(s).split(' ').filter(x=>x.length>=3&&!stopWords.has(x)))].slice(0,20)}
function searchKnowledge(prompt){const keys=tokens(prompt);if(!keys.length)return [];return db.items.filter(x=>x.status==='approved'&&scoped(x)).map(x=>{const ttl=norm(x.title),tags=norm(x.tags.join(' ')),txt=norm(x.text);const score=keys.reduce((sum,k)=>sum+(ttl.includes(k)?6:0)+(tags.includes(k)?4:0)+(txt.includes(k)?1:0),0);return {...x,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5)}
function excerpt(text,keys){const sentences=String(text).split(/(?<=[.!?])\s+|\n+/).filter(Boolean);return sentences.map(t=>({t,score:keys.reduce((s,k)=>s+(norm(t).includes(k)?1:0),0)})).sort((a,b)=>b.score-a.score).slice(0,2).map(x=>x.t.trim()).join(' ')}
function ask(){return heading('05 / GROUNDED SEARCH','Hỏi đáp A.I & Kiểm chứng','Tìm tài liệu theo dự án, trích đúng đoạn có liên quan và cho phép kiểm tra nguồn. Chưa kết nối mô hình A.I.',btn('▤ Xem kho tri thức','goto','', 'data-page="library"'))+`<div class="maincols"><div><div class="querybox"><textarea id="askInput" placeholder="Ví dụ: HERISH cần kiểm tra điều gì khi chăm sóc khách hàng?">${esc(answer?.question||'')}</textarea><div class="foot"><span class="muted small">Phạm vi: <strong>${esc(projects[scope])}</strong> · Chỉ đọc tài liệu đã duyệt</span>${btn('✧ Tra cứu & trích nguồn','answer','primary')}</div></div>${answer?`<div class="answer"><span class="eyebrow">KẾT QUẢ TRA CỨU / THEO QUY TẮC</span><h3>${answer.hits.length?'Thông tin tìm thấy':'Chưa đủ dữ liệu để trả lời'}</h3>${answer.hits.length?`<p>Em tìm được ${answer.hits.length} nguồn đã duyệt có liên quan. Dưới đây là các đoạn được trích từ tài liệu, chưa phải kết luận do A.I tự suy luận.</p>${answer.hits.slice(0,3).map((x,i)=>`<div class="source-hit"><span class="count">[${i+1}]</span><div class="grow"><strong>${esc(x.title)}</strong><p style="margin:4px 0;font-size:11px">“${esc(excerpt(x.text,tokens(answer.question))||x.text.slice(0,250))}”</p><small>${esc(projects[x.project])} · ${fmt(x.updated)} · ${esc(x.origin)}</small></div>${btn('Mở','detail','small',`data-id="${esc(x.id)}"`)}</div>`).join('')}`:'<p>Không tìm thấy nguồn đã duyệt phù hợp trong phạm vi hiện tại. Hãy kiểm tra dự án đang chọn hoặc bổ sung tài liệu vào kho trước.</p>'}<div class="toolbar" style="margin:14px 0 0">${btn('⚑ Báo kết quả sai','report-answer','small ghost')}${btn('⌕ Xem nguồn','goto','small','data-page="library"')}</div></div>`:`<div class="card"><span class="eyebrow">GỢI Ý CÂU HỎI</span><div class="toolbar" style="margin:14px 0 0">${['Quy trình chăm sóc khách hàng HERISH','Kiểm tra sản phẩm CERISH thế nào?','Khung tư duy ra quyết định'].map(x=>btn('↗ '+esc(x),'example','small ghost',`data-value="${esc(x)}"`)).join('')}</div></div>`}</div><div class="card"><div class="cardhead"><h2>Quy tắc kiểm chứng</h2></div>${[['✓','Chỉ trích tài liệu đã duyệt'],['▤','Mỗi đoạn kèm nguồn gốc'],['◎','Tôn trọng phạm vi dự án'],['⚑','Gửi phản hồi khi nguồn sai'],['⊘','Không đoán số liệu khi thiếu dữ liệu']].map(([ic,t])=>`<div class="mini-log"><span style="color:#83d6ec;font-size:18px">${ic}</span><div class="grow"><strong>${t}</strong></div></div>`).join('')}<div class="boxnote" style="margin-top:13px">Ở bản dùng thật, module này có thể bổ sung A.I truy xuất tăng cường, câu trả lời có nguồn và quyền truy cập ở máy chủ.</div></div></div>`}
function renderModal(){let body='',title='',wide=false;if(modal.type==='note'){title='Nhập ghi chú tri thức';body=`<form id="noteForm"><div class="formgroup"><label>Tiêu đề *</label><input class="field" name="title" required placeholder="Ví dụ: Quy trình CSKH HERISH" value="${esc(modal.prefill?.title||'')}"></div><div class="formrow"><div class="formgroup"><label>Thuộc phạm vi nào?</label><select class="select" name="project">${Object.entries(projects).filter(([k])=>k!=='all').map(([k,v])=>`<option value="${k}" ${k===(modal.prefill?.project||(scope==='all'?'shared':scope))?'selected':''}>${v}</option>`).join('')}</select></div><div class="formgroup"><label>Loại nội dung</label><select class="select" name="kind"><option>Ghi chú</option><option>Tài liệu</option><option>Biên bản họp</option><option>Quy trình</option></select></div></div><div class="formgroup"><label>Nội dung *</label><textarea class="area" name="text" required rows="8" placeholder="Dán nội dung tri thức hoặc ghi chú tại đây...">${esc(modal.prefill?.text||'')}</textarea></div><div class="formgroup"><label>Nguồn / tác giả</label><input class="field" name="origin" value="${esc(modal.prefill?.origin||'Ghi chú người dùng')}" placeholder="Nguồn thông tin"></div><div class="modalactions"><button class="btn" type="button" data-act="close">Hủy</button><button class="btn primary" type="submit">Lưu vào hộp tiếp nhận</button></div></form>`}else if(modal.type==='link'){title='Lưu liên kết nguồn';body=`<form id="linkForm"><div class="formgroup"><label>Tên liên kết *</label><input name="title" class="field" required placeholder="Tên tài liệu / trang web"></div><div class="formgroup"><label>Đường dẫn HTTPS *</label><input name="url" type="url" pattern="https://.*" class="field" required placeholder="https://..."></div><div class="formgroup"><label>Thuộc dự án</label><select name="project" class="select">${Object.entries(projects).filter(([k])=>k!=='all').map(([k,v])=>`<option value="${k}" ${k===(scope==='all'?'shared':scope)?'selected':''}>${v}</option>`).join('')}</select></div><p class="muted small">Bản offline chỉ lưu URL và đánh dấu thiếu nội dung. Không tự tải và đọc trang web.</p><div class="modalactions"><button type="button" data-act="close" class="btn">Hủy</button><button type="submit" class="btn primary">Lưu URL</button></div></form>`}else if(modal.type==='detail'){let x=db.items.find(x=>x.id===modal.id);if(!x)return '';wide=true;title=x.title;body=`<div class="toolbar">${projectBadge(x.project)}${badgeStatus(x.status)}<span class="chip">Phiên bản ${x.version||1}</span></div><dl class="info-list"><dt>Nguồn</dt><dd>${esc(x.origin)}</dd><dt>Loại tài liệu</dt><dd>${esc(x.kind)}</dd><dt>Ngày nhập</dt><dd>${fmt(x.created)}</dd><dt>Cập nhật</dt><dd>${fmt(x.updated)}</dd><dt>Từ khóa</dt><dd>${esc((x.tags||[]).join(', ')||'Chưa phân loại')}</dd><dt>Kiểm chứng</dt><dd>${x.verified?'Đã xác nhận thủ công':'Chưa xác nhận'}</dd>${x.sourceUrl?`<dt>Liên kết</dt><dd>${/^https:\/\//i.test(x.sourceUrl)?`<a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(x.sourceUrl)}</a>`:esc(x.sourceUrl)}</dd>`:''}</dl><div class="sep"></div><div class="itemtext">${esc(x.text||'Chưa có nội dung được trích xuất.')}</div>${x.note?`<p class="boxnote">${esc(x.note)}</p>`:''}<div class="modalactions" style="flex-wrap:wrap">${x.status!=='approved'?btn('⚙ Xử lý','process-one','small',`data-id="${esc(x.id)}"`)+btn('✓ Duyệt','approve','small teal',`data-id="${esc(x.id)}"`):btn('＋ Tạo phiên bản mới','new-version','small primary',`data-id="${esc(x.id)}"`)}${btn('Đóng','close')}</div>`}else if(modal.type==='connector'){const label={drive:'Google Drive',crm:'CRM',erp:'ERP',mail:'Email / Lịch'}[modal.key]||'Nguồn ngoài';title=`Thiết lập kết nối · ${label}`;body=`<div class="boxnote">Kết nối này chưa được cấu hình. Không thể bấm một nút để đồng bộ nếu chưa có máy chủ và quyền truy cập thật.</div><div class="sep"></div><h3>Điều kiện triển khai</h3><div class="info-list"><dt>1. Xác thực</dt><dd>Ủy quyền hoặc token từ nhà cung cấp (không nhập vào demo)</dd><dt>2. Phạm vi</dt><dd>Xác định dự án, loại dữ liệu, quyền đọc/ghi</dd><dt>3. Đồng bộ</dt><dd>Có bộ chuyển đổi cấu trúc dữ liệu, theo dõi trạng thái và xử lý lỗi</dd><dt>4. Kiểm chứng</dt><dd>Đối chiếu nguồn, cập nhật chỉ mục, ghi nhật ký</dd></div><div class="modalactions">${btn('Đã hiểu','close','primary')}</div>`}else if(modal.type==='search'){title='Tìm kiếm nhanh';body=`<input class="field" style="width:100%" id="modalSearch" placeholder="Tìm tài liệu, tiêu đề, từ khóa..." autofocus><div id="modalSearchResults" style="margin-top:12px"></div>`}else if(modal.type==='import'){title='Khôi phục dữ liệu demo';body=`<p class="muted">Chọn bản sao lưu JSON đã xuất từ ứng dụng. Dữ liệu hiện tại sẽ bị thay thế.</p><input type="file" id="importFile" accept="application/json,.json" class="field" style="width:100%"><div class="modalactions">${btn('Hủy','close')}${btn('Khôi phục','import-confirm','primary')}</div>`}
return `<div class="overlay" id="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2>${btn('✕','close','small ghost')}</div>${body}</div></div>`}
function render(){let content=page==='home'?home():page==='inbox'?inbox():page==='process'?process():page==='sources'?sources():page==='library'?library():ask();document.getElementById('app').innerHTML=shell(content);if(modal?.type==='search')updateQuickSearch('')}
function pushItem(item){db.items.unshift({id:id(),project:item.project||'shared',title:item.title,text:item.text||'',kind:item.kind||'Ghi chú',origin:item.origin||'Người dùng',sourceUrl:item.sourceUrl||'',tags:item.tags||[],status:item.status||'new',verified:false,version:item.version||1,previous:item.previous||null,created:now(),updated:now(),note:item.note||''});save();modal=null;page='inbox';tab='all';render();toast('Đã thêm vào hộp tiếp nhận. Chưa đưa vào kho tri thức.')}
function classify(item){if(item.status==='approved')return 'approved';if(!item.text.trim()){item.status='needs';item.tags=[];item.updated=now();return item.status}let match=db.items.find(x=>x.id!==item.id&&norm(x.text)===norm(item.text)&&norm(x.text).length>20&&x.status==='approved');if(match){item.status='duplicate';item.note='Phát hiện nội dung tương đồng với tài liệu '+match.title;item.updated=now();return item.status}let n=norm(item.title+' '+item.text), tags=[];let rules=[['quy trinh','Quy trình'],['khach hang','CSKH'],['marketing','Marketing'],['san pham','Sản phẩm'],['bao cao','Báo cáo'],['quyet dinh','Quyết định'],['chien luoc','Chiến lược'],['spa','Spa'],['tai chinh','Tài chính']];for(let [needle,t] of rules)if(n.includes(needle))tags.push(t);item.tags=[...new Set(tags)];if(item.project==='shared'){if(n.includes('herish'))item.project='herish';else if(n.includes('cerish'))item.project='cerish';else if(n.includes('orish'))item.project='orish'}item.status='review';item.verified=false;item.updated=now();return item.status}
function runAction(act,el){let key=el.dataset.id;switch(act){case 'goto':return go(el.dataset.page||'home');case 'scope-project':scope=el.dataset.project;return go('library');case 'global-search':modal={type:'search'};return render();case 'note':modal={type:'note'};return render();case 'link':modal={type:'link'};return render();case 'upload':return document.getElementById('fileInput')?.click();case 'close':modal=null;return render();case 'detail':modal={type:'detail',id:key};return render();case 'select-process':selected=key;return render();case 'process-one':{let x=db.items.find(v=>v.id===key);if(x){const s=classify(x);save();toast('Đã xử lý: '+st[s][0]);modal=null;selected=x.id;return render()}return}case 'process-all':{let n=0;db.items.filter(x=>x.status==='new').forEach(x=>{classify(x);n++});save();render();toast('Đã xử lý '+n+' mục mới. Hãy kiểm tra trước khi duyệt.');return}case 'approve':{let x=db.items.find(v=>v.id===key);if(!x)return;if(!x.text.trim()){toast('Chưa có nội dung để xác nhận.');return}if(x.status!=='review'){toast('Cần chạy xử lý và chuyển sang trạng thái Chờ xác nhận trước khi duyệt.');return}x.status='approved';x.verified=true;x.updated=now();save();modal=null;selected=null;render();toast('Đã xác nhận và đưa vào kho tri thức.');return}case 'reject':{let x=db.items.find(v=>v.id===key);if(x){x.status='rejected';x.updated=now();save();selected=null;render();toast('Đã loại tài liệu khỏi hàng chờ.')}return}case 'new-version':{const x=db.items.find(v=>v.id===key);if(!x)return;modal={type:'note',prefill:{title:x.title,text:x.text,project:x.project,origin:x.origin},version:x.version+1,previous:x.id};return render()}case 'connector':modal={type:'connector',key:el.dataset.connector};return render();case 'export':return download(JSON.stringify(db,null,2),'XTRUONGMKTER_KNOWLEDGE_BACKUP.json','application/json');case 'import':modal={type:'import'};return render();case 'import-confirm':return restore();case 'answer':return runAnswer();case 'example':go('ask');document.getElementById('askInput').value=el.dataset.value;return runAnswer();case 'report-answer':db.feedback.push({id:id(),question:answer?.question||'',scope,created:now()});save();toast('Đã lưu phản hồi vào bản demo để kiểm tra.');return;}}
function runAnswer(){const text=document.getElementById('askInput')?.value.trim();if(!text)return toast('Hãy nhập câu hỏi.');answer={question:text,hits:searchKnowledge(text)};render()}
function download(body,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([body],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function updateQuickSearch(value){let rows=db.items.filter(x=>x.status==='approved'&&scoped(x)&&(!value||norm(x.title+' '+x.text).includes(norm(value)))).slice(0,8);const box=document.getElementById('modalSearchResults');if(box)box.innerHTML=rows.map(x=>`<div class="mini-log"><span class="dot" style="--tone:${colors[x.project]}"></span><div class="grow"><strong>${esc(x.title)}</strong><small>${projects[x.project]}</small></div>${btn('Mở','detail','small',`data-id="${esc(x.id)}"`)}</div>`).join('')||'<div class="empty">Không tìm thấy nguồn đã duyệt.</div>'}
async function restore(){let file=document.getElementById('importFile')?.files[0];if(!file)return toast('Chọn tệp JSON cần khôi phục.');try{const content=JSON.parse(await file.text());if(!content||!Array.isArray(content.items)||content.items.some(x=>!x.id||!x.title||!['shared','herish','cerish','orish'].includes(x.project)))throw Error('invalid');db={items:content.items,feedback:Array.isArray(content.feedback)?content.feedback:[],events:[],connectors:[],settings:{}};save();modal=null;go('home');toast('Khôi phục dữ liệu hoàn tất.')}catch{toast('Tệp JSON không đúng định dạng sao lưu.') }}
async function filesAdded(files){if(!files?.length)return;let n=0;for(const file of files){if(file.size>1024*1024){toast('Tệp quá 1 MB: '+file.name);continue}const ext=file.name.split('.').pop().toLowerCase(),plain=['txt','md','csv','json'].includes(ext);let text='';try{if(plain)text=await file.text()}catch{}pushItem({title:file.name,text,kind:'Tệp '+ext.toUpperCase(),project:scope==='all'?'shared':scope,origin:'Tệp cục bộ · '+file.name,note:plain?'Nội dung văn bản đọc tại trình duyệt.':'Tệp đã được nhận dạng tên và loại, nhưng nội dung chưa trích xuất. Cần kết nối bộ đọc file tại máy chủ.',status:plain?'new':'needs'});n++}if(n>0)toast('Đã nhận '+n+' tệp. Các định dạng chưa hỗ trợ cần xử lý bổ sung.');}
const app=document.getElementById('app');app.addEventListener('click',ev=>{let target=ev.target.closest('[data-act]');if(target){ev.preventDefault();runAction(target.dataset.act,target)}else if(ev.target.id==='overlay'){modal=null;render()}});
app.addEventListener('submit',e=>{if(e.target.id==='noteForm'){e.preventDefault();const form=new FormData(e.target);const values=Object.fromEntries(form);pushItem({...values,version:modal.version||1,previous:modal.previous||null})}if(e.target.id==='linkForm'){e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f);if(!/^https:\/\//i.test(v.url))return toast('Chỉ hỗ trợ địa chỉ HTTPS.');pushItem({title:v.title,sourceUrl:v.url,project:v.project,kind:'Liên kết',origin:v.url,status:'needs',note:'Chưa lấy nội dung từ đường dẫn.'})}});
app.addEventListener('change',e=>{if(e.target.id==='scopeSelect'){scope=e.target.value;selected=null;answer=null;render()}if(e.target.id==='inboxStatus'||e.target.id==='processStatus'){tab=e.target.value;render()}if(e.target.id==='fileInput'){filesAdded(e.target.files)}});
app.addEventListener('input',e=>{if(['librarySearch','itemSearch'].includes(e.target.id)){let idTarget=e.target.id,pos=e.target.selectionStart;q=e.target.value;render();const input=document.getElementById(idTarget);input?.focus();input?.setSelectionRange(pos,pos)}if(e.target.id==='modalSearch')updateQuickSearch(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal={type:'search'};render();document.getElementById('modalSearch')?.focus()}if(e.key==='Escape'&&modal){modal=null;render()}if(e.key==='Enter'&&e.target.id==='askInput'&&(e.ctrlKey||e.metaKey)){runAnswer()}});
render();
})();

</script></body></html>
